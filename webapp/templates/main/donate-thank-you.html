{% extends 'main/base.html' %}

{% block page_container %}
<div class="donate-wrap">
  <div class="donate-card" style="text-align:center;">
    <div class="thank-you-check" aria-hidden="true">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="11" fill="#1b9421" opacity="0.12"/>
        <circle cx="12" cy="12" r="11" stroke="#1b9421" stroke-width="1.5" fill="none"/>
        <path d="m7.5 12.5 3 3 6-6.5" stroke="#1b9421" stroke-width="2"
              fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 class="donate-title" style="margin-top:14px;">Thank You!</h1>
    <p class="donate-subtitle" style="margin-top:8px;">
      Your generous gift helps make Christmas morning merry for foster children
      in Pulaski County. We are so grateful for your support.
    </p>
    <p class="donate-subtitle" style="margin-top:6px; font-size:0.85rem;">
      A receipt has been sent to the email address you provided.
    </p>

    <a href="/" class="donate-submit" style="display:inline-block; text-decoration:none; margin-top:22px; width:auto; padding-left:34px; padding-right:34px;">
      Back to Home
    </a>
  </div>
</div>
{% endblock %}
