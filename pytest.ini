[pytest]
# Run from the project root: `pytest`
# Tests live in tests/ and are named test_*.py
testpaths = tests
pythonpath = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
# Quiet the noisy third-party deprecation warnings so real failures stand out.
filterwarnings =
    ignore::DeprecationWarning
